<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>College Majors by Work Location (ACS/IPUMS)</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson@3"></script>
  </head>

  <body>
    <h1>Where College Graduates Work</h1>

    <div id="controls">
      <label for="major-select">Select a Major:</label>
      <select id="major-select"></select>
      
      <label for="occupation-select">Select an Occupation:</label>
      <select id="occupation-select"></select>
    </div>

    <div id="container">
      <div id="map"></div>
      <div id="details">
        <div id="salary-chart"></div>
        <div id="bottom-chart"></div>
      </div>
    </div>

    <!-- Import occupations mapping first -->
    <script src="occupations.js"></script>
    <!-- Then import main script -->
    <script src="script.js"></script>
  </body>
</html>
